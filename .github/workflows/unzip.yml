name: Extract website ZIP

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for site ZIP
        id: check
        run: |
          if [ -f dharmapur-times-website.zip ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract ZIP into repository
        if: steps.check.outputs.found == 'true'
        run: |
          set -e
          rm -rf .extract-tmp && mkdir .extract-tmp
          unzip -q -o dharmapur-times-website.zip -d .extract-tmp -x '__MACOSX/*'
          entries=(.extract-tmp/*)
          if [ ${#entries[@]} -eq 1 ] && [ -d "${entries[0]}" ]; then
            SRC="${entries[0]}"
          else
            SRC=".extract-tmp"
          fi
          shopt -s dotglob
          for f in "$SRC"/*; do
            mv "$f" ./
          done
          rm -rf .extract-tmp dharmapur-times-website.zip .github
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Dharmapur Times website files" || echo "nothing to commit"
          git push
